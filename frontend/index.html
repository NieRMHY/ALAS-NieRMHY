<!doctype html>
<html lang="zh-CN" data-motion-strength="strong">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101e2c" />
    <!-- Modify by MHY, 品牌本地化：ALAS（essex 部署版） -->
    <meta name="description" content="ALAS" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // 隧道反代入口形如 /<peer_id>，不带尾斜杠时相对路径会丢掉前缀而打到服务端。
      // 只在单段路径（隧道入口形态）补斜杠；根路径、已带斜杠与多段路径一律不动。
      if (/^\/[^/]+$/.test(location.pathname)) {
        document.write('<base href="' + location.pathname + '/">');
      }
    </script>
    <script>
      // 应用挂载前按上次会话的记录预载插件主题样式，避免默认外观先闪现再被皮肤覆盖。
      // 插件停用或更新后旧链接会 404，插件列表加载完成后由 PluginStyles 撤掉这些链接并纠正记录。
      // 插件管理页保持中性外观，不在该页预载。
      try {
        if (!/^#\/plugins$/.test(location.hash)) {
          var apuCached = JSON.parse(localStorage.getItem('azurpilot.apu-styles') || 'null');
          if (apuCached && typeof apuCached.id === 'string' && typeof apuCached.revision === 'string') {
            Object.keys(apuCached.styles || {}).forEach(function (component) {
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = './api/v1/plugins/' + apuCached.id + '/' + apuCached.revision + '/' +
                String(apuCached.styles[component]).split('/').map(encodeURIComponent).join('/') + '?component=' + component;
              // Modify by MHY, 标记预载来源，列表就绪后撤掉，避免切换或停用主题残留旧样式。
              link.dataset.apuPreload = '';
              document.head.appendChild(link);
            });
          }
        }
      } catch (error) { /* 缓存不可用时交给应用按正常流程加载。 */ }
    </script>
    <!-- Modify by MHY, favicon 换本地 ALAS 图（essex 版），删除 Clarity 遥测外联 -->
    <link rel="icon" type="image/png" href="%BASE_URL%alas-icon.png" />
    <title>ALAS</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
