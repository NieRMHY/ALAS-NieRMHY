<!doctype html>
<html lang="zh-CN" data-motion-strength="strong">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101e2c" />
    <!-- Modify by MHY, 品牌本地化：ALAS（essex 部署版） -->
    <meta name="description" content="ALAS" />
    <script>
      // 隧道反代入口形如 /<peer_id>，不带尾斜杠时相对路径会丢掉前缀而打到服务端。
      // 只在单段路径（隧道入口形态）补斜杠；根路径、已带斜杠与多段路径一律不动。
      if (/^\/[^/]+$/.test(location.pathname)) {
        document.write('<base href="' + location.pathname + '/">');
      }
    </script>
    <!-- Modify by MHY, favicon 换本地 ALAS 图（essex 版），删除 Clarity 遥测外联 -->
    <link rel="icon" type="image/png" href="%BASE_URL%alas-icon.png" />
    <title>ALAS</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
